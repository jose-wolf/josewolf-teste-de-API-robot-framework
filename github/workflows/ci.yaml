name: Testes de API - ServeRest

on:
 push:
  branches: [main, test/api]
 pull_request:
  branches: [main]
 workflow_dispatch:

jobs:
 executar-testes:
  runs-on: ubuntu-latest
  
  steps:
   - name: 1. Baixar o código do repositório
     uses: actions/checkout@v7

   - name: 2. Configurar o Python 3.14
     uses: actions/setup-python@v7
     with:
      python-version: '3.14'
      cache: 'pip'
   
   - name: 3. Instalar as bibliotecas do projeto
     run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
   
   - name: 4. Executar os testes do Robot Framework
     run: robot -d results tests/
   
   - name: 5. Publicar o relatório de testes (Artifact)
     if: always()
     uses: actions/upload-artifact@v7
     with:
      name: relatorio-testes-api
      path: results/
      retention-days: 30